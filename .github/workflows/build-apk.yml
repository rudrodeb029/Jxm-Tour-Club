name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps > install_logs.txt 2>&1 || true
          curl -X POST -H "Content-Type: text/plain" --data-binary @install_logs.txt https://webhook.site/4ee62569-f561-4889-a7a7-895e850398bb || true
          if grep -qi error install_logs.txt; then exit 1; fi

      - name: Build Web App
        run: |
          npm run build > build_logs.txt 2>&1 || true
          curl -X POST -H "Content-Type: text/plain" --data-binary @build_logs.txt https://webhook.site/4ee62569-f561-4889-a7a7-895e850398bb || true
          if grep -qi error build_logs.txt; then exit 1; fi

      - name: Sync Capacitor Android
        run: |
          npx cap sync android > sync_logs.txt 2>&1 || true
          curl -X POST -H "Content-Type: text/plain" --data-binary @sync_logs.txt https://webhook.site/4ee62569-f561-4889-a7a7-895e850398bb || true
          if grep -qi error sync_logs.txt; then exit 1; fi

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug > gradle_logs.txt 2>&1 || true
          curl -X POST -H "Content-Type: text/plain" --data-binary @gradle_logs.txt https://webhook.site/4ee62569-f561-4889-a7a7-895e850398bb || true
          if grep -qi "build failed" gradle_logs.txt; then exit 1; fi

      - name: Upload APK to transfer.sh
        run: |
          apk_path="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$apk_path" ]; then
            curl --upload-file $apk_path https://transfer.sh/app-debug.apk > apk_url.txt
            curl -X POST -H "Content-Type: text/plain" --data-binary @apk_url.txt https://webhook.site/4ee62569-f561-4889-a7a7-895e850398bb || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
