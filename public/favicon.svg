<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE680" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#996515" />
      <stop offset="65%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    
    <!-- Bright Gold for Stroke/Shine -->
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C3" />
      <stop offset="50%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    
    <!-- Sharp Drop Shadow to give a 3D effect -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="1.5" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Main JXM 3D Text -->
    <text x="60" y="75" font-family="'Impact', 'Arial Black', sans-serif" font-size="64" font-style="italic" font-weight="900" fill="url(#gold)" stroke="url(#goldShine)" stroke-width="1.5" text-anchor="middle" letter-spacing="-3">JXM</text>
    
    <!-- TOUR CLUB Text below -->
    <text x="60" y="100" font-family="'Impact', 'Arial Black', sans-serif" font-size="16" font-weight="bold" fill="url(#goldShine)" text-anchor="middle" letter-spacing="0">TOUR CLUB</text>
  </g>
</svg>
